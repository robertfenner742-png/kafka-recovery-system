spring:
  threads:
    virtual:
      enabled: true
  application:
    name: distributed-kafka-consumer
  kafka:
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 999
        max.poll.interval.ms: 6_00_000
        auto.offset.reset: latest
        enable.auto.commit: false
    listener:
      ack-mode: manual
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/mydb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 100
      minimum-idle: 90
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 3000
      # initialization-fail-timeout: 1
  jpa:
    hibernate: 
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

kafka:
  clusters:
    primary:
      bootstrap-servers: ${PRIMARY_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093,localhost:29094}
      topic:
        name: topic-1
    secondary:
      bootstrap-servers: ${SECONDARY_BOOTSTRAP_SERVERS:localhost:29095,localhost:29096,localhost:29097}
      topic:
        name: topic-1

server:
  port: 1993
  servlet:
    context-path: /consumer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,configprops
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.apache.kafka.clients.NetworkClient: ERROR