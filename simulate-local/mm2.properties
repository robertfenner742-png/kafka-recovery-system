############################
# Cluster aliases
############################
clusters = primary, secondary

############################
# Bootstrap servers
############################
primary.bootstrap.servers = kafka-cluster-a-broker-a:9092, kafka-cluster-a-broker-b:9093, kafka-cluster-a-broker-c:9094
secondary.bootstrap.servers = kafka-cluster-b-broker-a:9095, kafka-cluster-b-broker-b:9096, kafka-cluster-b-broker-c:9097

############################ 
# Replication policy (CRITICAL) 
############################ 
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy
##############################

############################
# Enable replication
############################
primary->secondary.enabled = true

############################
# Topics to replicate
############################
primary->secondary.topics = .*
primary->secondary.groups = .*

############################
# Offset sync (CRITICAL for DR & Failback)
############################
# Sync A's progress to B
primary->secondary.sync.group.offsets.enabled = true
primary->secondary.emit.checkpoints.enabled = true
primary->secondary.sync.group.offsets.interval.seconds = 5
primary->secondary.emit.checkpoints.interval.seconds = 5

# Offset behavior
# Change to 'none' to ensure MM2 does not auto-reset offsets and instead relies on the synced offsets. This is critical for DR and failback scenarios.
# We will manage offsets externally so that failover and failback can resume from the correct position without data loss or duplication.
consumer.auto.offset.reset = none

# Continuous discovery
refresh.topics.interval.seconds = 5
refresh.groups.interval.seconds = 5

############################
# Internal Topic Settings
############################
# Ensure these match your 3-broker setup
replication.factor = 2
checkpoints.topic.replication.factor = 2
heartbeats.topic.replication.factor = 2
offset-syncs.topic.replication.factor = 2
